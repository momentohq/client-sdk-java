name: On push to main branch

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MOMENTO_RELEASE_APP_ID }}
          private-key: ${{ secrets.MOMENTO_RELEASE_APP_PRIVATE_KEY }}

      - name: Setup repo
        uses: actions/checkout@v3
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate README
        uses: momentohq/standards-and-practices/github-actions/generate-and-commit-oss-readme@gh-actions-v2
        with:
          project_status: official
          project_stability: stable
          project_type: sdk
          sdk_language: Java
          dev_docs_slug: java

      - name: Verify examples README generation
        uses: momentohq/standards-and-practices/github-actions/generate-and-commit-oss-readme@gh-actions-v2
        with:
          project_status: official
          project_stability: beta
          project_type: other
          template_file: ./examples/README.template.md
          output_file: ./examples/README.md
